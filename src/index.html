<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RPG World · Pendragon Sandbox</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="RPG World — your character, always at hand." />
    <link rel="icon" type="image/svg+xml" href="rpgworld-mark.svg" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply the stored / preferred theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('rpg-theme');
          var dark = stored
            ? stored === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
